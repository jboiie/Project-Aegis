
services:
  # ── Aegis Gateway (FastAPI Proxy) ──────────────────────────
  aegis-gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src        # Hot-reload during development
      - ./models:/app/models
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ── Redis (Semantic Cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
