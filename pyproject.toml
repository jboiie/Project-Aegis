[project]
name = "project-aegis"
version = "0.1.0"
description = "Autonomous LLM Security Proxy & Red-Teaming Pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.0",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
redteam = [
    "groq>=0.9.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "jinja2>=3.1",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.22",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
